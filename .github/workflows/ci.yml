name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://jrsphere:test_password@localhost:5432/jrsphere_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jrsphere
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: jrsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jrsphere -d jrsphere_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Make this blocking once findings in apps/web and packages/shared-types are fixed.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm --filter @jrs-platform/api run prisma:generate
      - run: pnpm --filter @jrs-platform/api run prisma:migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
